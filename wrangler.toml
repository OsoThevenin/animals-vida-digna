name = "animals-vida-digna"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-08-15"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"

[observability]
enabled = true

[[ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60
